# Installs the compiler rust-toolchain.toml names (#248) and removes every other
# toolchain the runner image carries. Swatinem/rust-cache hashes `rustc -vV` of
# every installed toolchain into its key, so the image's own Rust made each
# runner-image rollout a cold cache although the build never used it (#748).
name: Pin the Rust toolchain
description: rustup toolchain install from rust-toolchain.toml, then remove the other toolchains.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install
        active="$(rustup show active-toolchain | cut -d' ' -f1 | tr -d '\r')"
        echo "Keeping $active"
        rustup toolchain list --quiet | tr -d '\r' | while read -r toolchain; do
          if [[ -n "$toolchain" && "$toolchain" != "$active" ]]; then
            rustup toolchain uninstall "$toolchain"
          fi
        done
        rustup toolchain list
