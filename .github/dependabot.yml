version: 2

updates:
  # Actions are pinned to commit SHAs, which is the only immutable reference a
  # `uses:` can take. Without this ecosystem those pins never move again, so the
  # workflows would silently miss the actions' own security fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The desktop crate is excluded from the workspace in Cargo.toml, so it has its
  # own lockfile and needs its own entry.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /packages/clients/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-desktop:
        patterns: ["*"]

  # Every external version lives in the `catalog:` of pnpm-workspace.yaml, which
  # Dependabot has updated since February 2025. Two upstream limits apply: it
  # labels every catalog entry `dependency-type: production` because the catalog
  # does not record dev/prod (dependabot-core#14824), and it has been reported to
  # commit a lockfile missing a catalog package (dependabot-core#14339). CI runs
  # `pnpm install --frozen-lockfile`, so the second fails the pull request rather
  # than reaching main.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
