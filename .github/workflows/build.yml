name: Build

on:
  workflow_call:

jobs:
  matrix:
    name: Load Build Matrix
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      hub: ${{ steps.filter.outputs.hub }}
      desktop: ${{ steps.filter.outputs.desktop }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        run: |
          jq -c '{include:[.targets[]|select(.enabled and .agent)]}' \
            .github/build-matrix.json > /tmp/agent.json
          jq -c '{include:[.targets[]|select(.enabled and .hub)]}' \
            .github/build-matrix.json > /tmp/hub.json
          jq -c '{include:[.targets[]|select(.enabled and .desktop)]}' \
            .github/build-matrix.json > /tmp/desktop.json
          {
            echo "agent=$(cat /tmp/agent.json)"
            echo "hub=$(cat /tmp/hub.json)"
            echo "desktop=$(cat /tmp/desktop.json)"
          } >> "$GITHUB_OUTPUT"

  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @termora/shared build
      - run: ./scripts/build-web.sh
        env:
          TERMORA_BUILD_HASH: ${{ github.sha }}
      # Artifacts on tags (release) or manual dispatch (downstream hub/desktop jobs
      # need them) — plain PR pushes just verify build + tests
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: web-dist-raw
          path: packages/clients/web/dist/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: web-dist-embedded
          path: packages/hub/static/
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check . --error-on-warnings

  test:
    name: Test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @termora/shared build
      - run: cargo build --release -p termora-hub-lock
      - run: pnpm test:run

  build-agent:
    name: Build Agent (${{ matrix.triple }})
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.agent) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 cross-compile tools
        if: matrix.triple == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Skip only the target we cannot execute: aarch64 is cross-compiled and
      # its binaries do not run on the x86 runner. `shell_sh` describes which
      # shell the build script below needs; cargo test does not care, and
      # gating on it left every cfg(windows) path compiled, linted and never
      # once executed.
      - name: Test
        if: matrix.triple != 'aarch64-unknown-linux-gnu'
        run: cargo test
      - name: Build (bash)
        if: matrix.shell_sh
        run: ./scripts/build-agent.sh
        env:
          TERMORA_TARGET_TRIPLE: ${{ matrix.triple }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Build (pwsh)
        if: ${{ !matrix.shell_sh }}
        shell: pwsh
        run: .\scripts\build-agent.ps1
        env:
          TERMORA_TARGET_TRIPLE: ${{ matrix.triple }}
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: agent-${{ matrix.triple }}
          path: dist/sea/termora-agent*
          retention-days: 1

  build-hub:
    name: Build Hub (${{ matrix.triple }})
    # Tags (release) or manual dispatch (pre-merge cross-platform validation)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [matrix, build-web]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.hub) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @termora/shared build
      - uses: actions/download-artifact@v7
        with:
          name: web-dist-embedded
          path: packages/hub/static/
      - name: Build (bash)
        if: matrix.shell_sh
        run: ./scripts/build-hub.sh
        env:
          TERMORA_SKIP_WEB: "true"
          TERMORA_TARGET_TRIPLE: ${{ matrix.triple }}
          TERMORA_BUILD_HASH: ${{ github.sha }}
      - name: Build (pwsh)
        if: ${{ !matrix.shell_sh }}
        shell: pwsh
        run: .\scripts\build-hub.ps1
        env:
          TERMORA_SKIP_WEB: "true"
          TERMORA_TARGET_TRIPLE: ${{ matrix.triple }}
          TERMORA_BUILD_HASH: ${{ github.sha }}
      # A binary that has never been run is not known to work. The bundle that
      # loads the SQLite addon at startup broke once and reached a tagged release,
      # because every job until packaging only ever produced the executable.
      # `agent status` goes through the native-addon bootstrap and prints, so that
      # bootstrap failing is an exit code here rather than a surprise later.
      #
      # What it does NOT prove: it never calls startHub(), so the hub lock addon,
      # the server, the databases and the port binding stay untested. Running the
      # daemon in CI is #147's job. This step's scope is the bootstrap that broke.
      #
      # Exit status alone is not enough either: a bundle that never reaches its
      # entry point exits 0 having printed nothing, which is the same failure in
      # another shape. So the output must parse and carry a version-shaped value.
      #
      # Version-SHAPED, not semver-valid, and not checked against anything here.
      # The question is whether the bundle reached its entry point and reported;
      # digits-and-dots answers it. This workflow also runs from a manual dispatch
      # with no tag in sight, so it cannot claim the value is the *right* version —
      # only `release.yml` compares the manifest to a tag, and what the artefacts
      # actually contain is #155.
      #
      # Gated on the shell alone, so every hub row runs one of the two. Every hub
      # target in .github/build-matrix.json is native to its runner, and a condition
      # for a non-native row that does not exist would only add a way to skip: a
      # skipped step is green, so an inconsistent matrix row would publish untested.
      # A future non-native hub row needs an explicit refusal here, not a predicate.
      - name: Smoke — the built hub runs and reports its version
        if: matrix.shell_sh
        timeout-minutes: 2
        run: |
          ./dist/sea/termora-hub agent status --json > status.json
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("status.json","utf8")); if(s===null||typeof s!=="object"||Array.isArray(s)||typeof s.hub_version!=="string"||!/^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/.test(s.hub_version)) throw new Error("status output carries no version-shaped hub_version: "+JSON.stringify(s.hub_version));'
      - name: Smoke — the built hub runs and reports its version (pwsh)
        if: ${{ !matrix.shell_sh }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          .\dist\sea\termora-hub.exe agent status --json > status.json
          if ($LASTEXITCODE -ne 0) { throw "the built hub failed to run ($LASTEXITCODE)" }
          # node, not ConvertFrom-Json: its pipeline unwraps a single-element array,
          # so [{"hub_version":"x"}] would pass here and fail the check above.
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("status.json","utf8")); if(s===null||typeof s!=="object"||Array.isArray(s)||typeof s.hub_version!=="string"||!/^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/.test(s.hub_version)) throw new Error("status output carries no version-shaped hub_version: "+JSON.stringify(s.hub_version));'
      - uses: actions/upload-artifact@v7
        with:
          name: hub-${{ matrix.triple }}
          path: dist/sea/termora-hub*
          retention-days: 1

  build-desktop:
    name: Build Desktop (${{ matrix.triple }})
    # Tags (release) or manual dispatch (pre-merge cross-platform validation)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [matrix, build-agent, build-hub, build-web]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/clients/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @termora/shared build
      - uses: actions/download-artifact@v7
        with:
          name: agent-${{ matrix.triple }}
          path: dist/sea/
      - uses: actions/download-artifact@v7
        with:
          name: hub-${{ matrix.triple }}
          path: dist/sea/
      - uses: actions/download-artifact@v7
        with:
          name: web-dist-raw
          path: packages/clients/web/dist/
      - name: Place sidecars + build (bash)
        if: matrix.shell_sh
        run: |
          TRIPLE="${{ matrix.triple }}"
          cp dist/sea/termora-agent "packages/clients/desktop/src-tauri/termora-agent-${TRIPLE}"
          cp dist/sea/termora-hub "packages/clients/desktop/src-tauri/termora-hub-${TRIPLE}"
          pnpm -F @termora/shared build
          pnpm -F @termora/desktop tauri build --config '{"build":{"beforeBuildCommand":""}}'
      - name: Place sidecars (pwsh)
        if: ${{ !matrix.shell_sh }}
        shell: pwsh
        run: |
          $triple = "${{ matrix.triple }}"
          Copy-Item dist\sea\termora-agent.exe "packages\clients\desktop\src-tauri\termora-agent-$triple.exe"
          Copy-Item dist\sea\termora-hub.exe "packages\clients\desktop\src-tauri\termora-hub-$triple.exe"
      # The pull-request gate lives in ci.yml. Keep this release/manual path as
      # defense in depth, and lint before the expensive Tauri package build.
      - name: Clippy (desktop crate)
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        shell: pwsh
        working-directory: packages/clients/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Build desktop (pwsh)
        if: ${{ !matrix.shell_sh }}
        shell: pwsh
        run: |
          pnpm -F @termora/shared build
          pnpm -F @termora/desktop tauri build --config '{\"build\":{\"beforeBuildCommand\":\"\"}}'
      # Uses the real Partner Center identity when the repository variables are
      # set, so the packaged identity is exercised before a tagged release;
      # falls back to the manifest placeholders otherwise.
      - name: Package unsigned MSIX
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          # Hashtable splatting: an array splat would bind these positionally.
          $packArgs = @{ SkipBuild = $true }
          if ($env:MSIX_IDENTITY_NAME -and $env:MSIX_PUBLISHER -and $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            $packArgs.IdentityName = $env:MSIX_IDENTITY_NAME
            $packArgs.Publisher = $env:MSIX_PUBLISHER
            $packArgs.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME
          }
          .\packages\clients\desktop\msix\pack-msix.ps1 @packArgs
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.triple }}
          path: |
            packages/clients/desktop/src-tauri/target/release/bundle/**/*.msi
            packages/clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/clients/desktop/src-tauri/target/release/bundle/**/*.dmg
            packages/clients/desktop/src-tauri/target/release/bundle/**/*.deb
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        with:
          name: desktop-msix-${{ matrix.triple }}
          path: packages/clients/desktop/msix/out/*.msix
          retention-days: 1
