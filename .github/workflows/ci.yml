name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: every scope not listed here is none. Nothing in
# this workflow or the one it calls uses the token — no gh command, no API call —
# and actions/checkout documents contents: read as what it needs. Without this the
# jobs take the repository default, which is write, while running pnpm install and
# cargo build.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  desktop-webview-boundary:
    name: Desktop webview boundary (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      # The compiler and its components come from rust-toolchain.toml (#248).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/clients/desktop/src-tauri
      # These are the upstream Tauri v2 Linux build dependencies. Keep the
      # WebKit driver and Xvfb alongside them: the next step requires both to
      # launch a real renderer rather than silently falling back to a unit test.
      # The package is webkit2gtk-driver on this runner; other distributions
      # call it webkitgtk-webdriver. Both provide the WebKitWebDriver executable.
      - name: Install Tauri and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @lasterm/shared build
      - run: ./scripts/build-web.sh
        env:
          LASTERM_BUILD_HASH: ${{ github.sha }}
      - run: ./scripts/build-agent.sh
      - run: ./scripts/build-hub.sh
        env:
          LASTERM_SKIP_WEB: "true"
          LASTERM_BUILD_HASH: ${{ github.sha }}
      - name: Place desktop sidecars
        run: |
          cp dist/sea/lasterm-agent packages/clients/desktop/src-tauri/lasterm-agent-x86_64-unknown-linux-gnu
          cp dist/sea/lasterm-hub packages/clients/desktop/src-tauri/lasterm-hub-x86_64-unknown-linux-gnu
      # Its cfg(unix) paths, the raise socket among them, run only here.
      - name: Test the desktop crate
        working-directory: packages/clients/desktop/src-tauri
        run: cargo test
      - name: Build packaged desktop application
        run: pnpm -F @lasterm/desktop tauri build --debug --no-bundle
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Observe the renderer boundary
        run: xvfb-run --auto-servernum pnpm -F @lasterm/desktop test:e2e

  lint-desktop-windows:
    name: Clippy (desktop, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The compiler and its components come from rust-toolchain.toml (#248).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/clients/desktop/src-tauri
      # Tauri resolves externalBin while compiling. Clippy neither executes nor
      # packages the sidecars, so empty files are sufficient for that lookup.
      - name: Prepare Tauri sidecar placeholders
        shell: pwsh
        working-directory: packages/clients/desktop/src-tauri
        run: |
          foreach ($sidecar in @("lasterm-agent-x86_64-pc-windows-msvc.exe", "lasterm-hub-x86_64-pc-windows-msvc.exe")) {
            if (!(Test-Path $sidecar)) { [System.IO.File]::WriteAllBytes($sidecar, [byte[]]@()) }
          }
      - name: Clippy
        working-directory: packages/clients/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # The desktop crate is its own workspace, so the root `cargo test` in
      # build.yml never reaches it: without this step its tests ran nowhere.
      - name: Test
        working-directory: packages/clients/desktop/src-tauri
        run: cargo test

  lint-tls-identity-windows:
    name: Clippy (tls identity, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      # The compiler and its components come from rust-toolchain.toml (#248).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/lasterm-tls-identity
      # napi's Windows build script locates libnode.dll through PATH. setup-node
      # puts the selected Node installation, including that DLL, on PATH.
      - name: Clippy
        working-directory: crates/lasterm-tls-identity
        run: cargo clippy --all-targets -- -D warnings

  licenses:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust dependency licenses (cargo-deny, root workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
      - name: Rust dependency licenses (cargo-deny, desktop Tauri tree)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
          manifest-path: packages/clients/desktop/src-tauri/Cargo.toml
          # --config is a global option and must precede the subcommand, so it
          # belongs with the other global flags rather than in command-arguments.
          arguments: --all-features --config packages/clients/desktop/src-tauri/deny.toml
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: npm dependency licenses (allowlist)
        run: ./scripts/check-npm-licenses.sh
