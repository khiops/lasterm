[package]
name = "lasterm-agent"
version = "0.13.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/khiops/lasterm"

[[bin]]
name = "lasterm-agent"
path = "src/main.rs"

[dependencies]
# Extracted to its own repo (khiops/async-xpty, #87). Git dep pinned to an
# immutable rev during co-development; switches to a crates.io version once
# published. Bumping the rev is a deliberate, reviewable change.
async-xpty = { git = "https://github.com/khiops/async-xpty", rev = "4836ce2d9548fe6591bdcde6cbde234e7ba3e046" }
tokio = { version = "1", features = ["full"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# The owner id of a hub is the SHA-256 of its key (#127).
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# The daemon's log, one file per day that nothing ever renames (#646).
tracing-appender = "0.2"
# The day the file from before one per day was last written, to rank it among
# the daily files (#646). Already built for tracing-appender.
time = { version = "0.3", default-features = false, features = ["std"] }
ulid = "3"
vt100 = "0.16"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rmpv = { version = "1", features = ["with-serde"] }
