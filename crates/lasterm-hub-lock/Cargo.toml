[package]
name = "lasterm-hub-lock"
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/khiops/lasterm"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
lasterm-process-lock = { path = "../lasterm-process-lock" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
napi-build = "2"
