[package]
name = "lasterm-desktop"
version = "0.9.0"
description = "Lasterm desktop app (Tauri v2)"
authors = ["Lasterm contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/khiops/lasterm"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lasterm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"], default-features = false }
dirs = "6"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
lasterm-process-lock = { path = "../../../../crates/lasterm-process-lock" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[profile.release]
# Keep lto = false (Cargo default) for fast CI builds.
# Strip debug symbols — smaller binary.
strip = true
