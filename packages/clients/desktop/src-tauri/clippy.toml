# Protected files (the TLS identity, the hub pin store, the runtime
# directories) are touched only through this crate's descriptor-relative
# primitives: `open_parent`, `open_directory` and `Directory`'s methods.
# Clippy refuses every other filesystem call that names a path. A call that
# touches no protected file, or is one of those primitives, carries
# `#[expect(clippy::disallowed_methods, reason = "...")]` saying what it
# touches, on the narrowest item or statement holding it.
#
# Clippy reads the first clippy.toml found from a crate's directory up, so this
# list covers the crate beside it only. The same list is in
# crates/lasterm-protected-fs, crates/lasterm-tls-identity and
# packages/clients/desktop/src-tauri: change the three together.
#
# A path into a crate absent from the build is skipped without a word. A
# Unix-only path (std::os::unix, libc, which Windows builds can reach without
# these functions) and a Windows-only one (std::os::windows) are marked
# `allow-invalid`: otherwise clippy warns where the platform lacks them.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::copy", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::create_dir", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::create_dir_all", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::exists", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::hard_link", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::metadata", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::read", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::read_dir", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::read_link", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::read_to_string", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::remove_dir", reason = "a protected file is touched only through lasterm-protected-fs" },
    { path = "std::fs::remove_dir_all", reason = "a protected file is touched only through lasterm-protected-fs" },
